<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook – Lylou-Vely</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Arial,sans-serif; background:#F5EEFF; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    .fb-header { background:linear-gradient(135deg, #6B3FA0 0%, #4A2870 100%); padding:10px 20px; text-align:center; flex-shrink:0; }
    .fb-header p { font-family:'Dancing Script',cursive; font-size:18px; color:white; }
    .fb-container { flex:1; overflow:hidden; display:flex; align-items:stretch; }
    .fb-container iframe { width:100%; height:100%; border:none; flex:1; }
  </style>
</head>
<body>
<div class="fb-header">
  <p>Notre page Facebook 💜</p>
</div>
<div class="fb-container">
  <iframe
    src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Flylouvely&tabs=timeline&width=1200&height=900&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true"
    style="width:100%;height:100%;border:none;"
    scrolling="yes"
    frameborder="0"
    allowfullscreen="true"
    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
  </iframe>
</div>
</body>
</html>
